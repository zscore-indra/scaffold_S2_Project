# Streamlit theme for the ExpenseFlow UI.
# Colours are drawn from a validated, colourblind-safe palette (blue brand +
# reserved status hues). Read by `streamlit run` when launched from the repo root.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false
